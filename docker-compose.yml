services:
  app:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      PORT: 3001
      WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATA_FILE: /app/data/hanabi.json
    volumes:
      - hanabi_data:/app/data
    expose:
      - "3001"
  nginx:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HANABI_HTTP_PORT:-80}:80"
volumes:
  hanabi_data:
